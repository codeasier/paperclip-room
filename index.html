  try{
    const run=await requestJSON(`/api/run?agent=${encodeURIComponent(agent)}&run=${encodeURIComponent(runId)}`);
    if(selected!==agent || teamId!==company || epoch!==detailRunEpoch) return;
    if(run.id!==runId || run.agentId!==agent) throw new Error('运行标识不一致');
    const old=detailRuns.get(runId);
    detailRuns.set(runId,old?.extended ? {...run,entries:mergedEntries(old.entries,run.entries),nextCursor:old.nextCursor,extended:true} : run);
  }catch(e){if(selected===agent && teamId===company && epoch===detailRunEpoch) detailRunErrors.set(runId,'执行过程暂时读取失败，可重试。');}
  finally{
    if(selected===agent && teamId===company && epoch===detailRunEpoch){
      detailRunLoading.delete(runId);
      if(panelOpen && detailTarget?.runId===runId) renderDetail();
    }
  }
}
function bindToolDetails(container){
  container.querySelectorAll('[data-tool]').forEach(el=>el.addEventListener('toggle',()=>{
    if(!el.isConnected) return;
    if(el.open) toolExpanded.add(el.dataset.tool);else toolExpanded.delete(el.dataset.tool);
  }));
}
$('#detailpane').addEventListener('click',async e=>{
  const button = e.target.closest('[data-run-more]');
  if(!button) return;
  const id=selected,company=teamId,epoch=detailRunEpoch, runId=button.dataset.runMore, run=executionById(runId);
  if(!run?.nextCursor || moreLoading.has(runId)) return;
  moreLoading.add(runId); button.disabled=true; button.textContent='正在加载…';
  const pane=$('#detailpane'), oldHeight=pane.scrollHeight,oldTop=pane.scrollTop;
  try{
    const page=await requestJSON(`/api/run?agent=${encodeURIComponent(id)}&run=${encodeURIComponent(runId)}&before=${run.nextCursor}`);
    if(selected!==id || teamId!==company || epoch!==detailRunEpoch) return;
    if(page.state!=='available') throw new Error(page.note || '会话读取失败');
    const current=executionById(runId);
    if(current){current.entries=mergedEntries(page.entries,current.entries);current.nextCursor=page.nextCursor;current.extended=true;}
  }catch(e){toast('读取更早过程失败，请重试');}
  finally{
    if(epoch===detailRunEpoch) moreLoading.delete(runId);
    if(id===selected && company===teamId && epoch===detailRunEpoch && panelOpen && detailTarget?.runId===runId){
      detailSignature=null;renderDetail();
      pane.scrollTop=oldTop+Math.max(0,pane.scrollHeight-oldHeight);
    }
  }
});

function eventKey(ev){
  let hash = 2166136261;
  const identity = [ev.kind, ev.id || [ev.issueId, ev.ts, ev.agent, ev.user, ev.text]];
  for(const c of JSON.stringify(identity)) hash = Math.imul(hash ^ c.charCodeAt(0), 16777619);
  return `${selected}-${hash >>> 0}`;
}
function updateLatest(){
  const box = $("#stream");
  $("#latest").hidden = roomSignature === null || box.scrollHeight - box.scrollTop - box.clientHeight < 90;
}
$("#stream").addEventListener("scroll", updateLatest, {passive:true});
$("#latest").onclick = () => { $("#stream").scrollTop = $("#stream").scrollHeight; updateLatest(); };

window.addEventListener("resize", () => {
  updateLatest(); updateChatLatest();
  if(taskLayout === 'trace'){tasksSignature=null;renderTasks();}
});

function communication(ev){
  const sender = ev.sender || {name:names[ev.agent] || (ev.agent ? "未知成员" : ev.user ? "用户" : "系统")};
  const from = sender.name || names[sender.id] || "未知成员";
  // 兼容旧响应时也不猜收件人：评论确实发布在这条任务的讨论区。
  const recipients = ev.recipients?.length ? ev.recipients : [{name:`${ev.issue || "任务"} 讨论区`}];
  const to = recipients.map(r => r.name || names[r.id] || "未识别对象").join("、");
  const title = ev.issueTitle || (ev.text || "").split("\n").find(line => line.trim()) || "任务消息";
  return {from, to, title, evidence:ev.recipientSource === "explicit_header" ? "接收方：消息首行明确指定" : "接收方：任务讨论区，原文未指定个人"};
}

function routeAvatar(name, discussion = false){
  return `<span class="route-avatar ${discussion ? "discussion" : ""}" title="${esc(name)}" role="img" aria-label="${esc(name)}">${discussion ? '<span class="ava" aria-hidden="true">#</span>' : avatar(name)}</span>`;
}
function avatarRoute(ev){
  const {from} = communication(ev);
  const recipients = ev.recipients?.length ? ev.recipients : [{name:`${ev.issue || "任务"} 讨论区`}];
  return `${routeAvatar(from)}<span class="comm-arrow" aria-hidden="true">→</span>${recipients.slice(0,2).map(r => routeAvatar(r.name || names[r.id] || "未识别对象", r.kind === "issue" || /讨论区$/.test(r.name || ""))).join("")}${recipients.length > 2 ? `<span class="route-extra">+${recipients.length-2}</span>` : ""}`;
}
function preserveStreamLayout(change){
  const box = $("#stream"), top = box.getBoundingClientRect().top;
  const stuck = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  const anchor = Array.from(box.querySelectorAll("[data-event]")).find(el=>el.getBoundingClientRect().bottom > top);
  const offset = anchor ? anchor.getBoundingClientRect().top - top : 0;
  change();
  if(stuck) box.scrollTop = box.scrollHeight;
  else if(anchor) box.scrollTop += anchor.getBoundingClientRect().top - box.getBoundingClientRect().top - offset;
  updateLatest();
}
function renderDetail(){
  if(!activeMessage){
    const target=detailTarget;
    if(!target){
      $('#detailcontent').innerHTML='<div class="empty"><strong>详情</strong><span>点击消息、任务或运行查看对应详情。</span></div>';
      return;
    }
    const task=tasks.find(t=>t.id===target.taskId || target.issue && t.identifier===target.issue);
    const issueEvent=roomEvents.find(e=>e.kind==='issue' && (e.issueId===target.taskId || target.issue && e.issue===target.issue));
    if(!target.runId) target.runId=latestTaskRunId(task,target.issue || issueEvent?.issue);
    const run=executionById(target.runId);
    if(target.runId && !run) loadDetailRun(target.runId);
    const attempt=(run ? {...run,startedAt:run.ts,agentName:names[run.agentId]} : null) || (task?.attempts || []).find(r=>r.id===target.runId);
    const signature=JSON.stringify([target,task,issueEvent,attempt,run,detailRunLoading.has(target.runId),detailRunErrors.get(target.runId),moreLoading.has(target.runId)]);
    if(signature===detailSignature) return;
    const key=JSON.stringify(target), same=$('#detailcontent').dataset.event===key, scroll=same ? $('#detailpane').scrollTop : 0;
    let html=`<article class="comm-detail"><div class="output-label">${target.runId ? '运行与任务详情' : '任务详情'}</div><h3>${esc(task?.identifier || issueEvent?.issue || run?.issue || target.issue || '任务')} · ${esc(task?.title || issueEvent?.title || run?.issueTitle || '任务信息')}</h3>${statusChip(task?.status || issueEvent?.status,'任务：')}</article>`;
    if(attempt) html+=`<div class="comm-detail"><strong>${esc(attempt.agentName || names[attempt.agentId] || '未知成员')} · ${esc(RUN_STATUS[attempt.status] || attempt.status)}</strong><div class="task-facts">开始：${esc(attempt.startedAt ? traceTime(Date.parse(attempt.startedAt)) : '尚未开始 / 未记录')}<br>结束：${esc(attempt.finishedAt ? traceTime(Date.parse(attempt.finishedAt)) : ['running','cancelling'].includes(attempt.status) ? '执行中' : '未记录')}<br>运行：${esc(attempt.id)}</div></div>`;
    html+=run ? executionBodyHTML(run) : target.runId ? `<div class="comm-detail task-note">${detailRunErrors.has(target.runId) ? `${esc(detailRunErrors.get(target.runId))}<button type="button" class="text-button" data-run-retry="${esc(target.runId)}">重试</button>` : '正在读取工具调用与助手消息…'}</div>` : `<div class="comm-detail task-note">${task ? esc(taskExecutionNote(task)) : '当前查询窗口暂无该成员的执行过程。'}</div>`;
    html+=task ? taskDetailHTML(task) : '<div class="comm-detail task-note">该任务不在当前任务详情查询窗口内；这里只显示已获取的记录。</div>';
    $('#detailcontent').innerHTML=html;
    bindToolDetails($('#detailcontent'));
    $('#detailcontent').dataset.event=key;
    $('#detailpane').scrollTop=scroll;detailSignature=signature;
    return;
  }
  const ev = messageEvents.get(activeMessage);
  if(!ev) return;
  const signature = JSON.stringify([activeMessage,ev,names]);
  if(signature === detailSignature) return;
  const same = $("#detailcontent").dataset.event === activeMessage;
  const scroll = same ? $("#detailpane").scrollTop : 0;
  const {from,to,title,evidence} = communication(ev), receipt = receiptView(ev);
  $("#detailcontent").innerHTML = `<article class="comm-detail"><div class="output-label">消息详情</div><div class="detail-route">${avatarRoute(ev)}</div><div class="comm-address">${esc(from)} → ${esc(to)}</div><div class="comm-topic">来源：${esc(ev.issue || "任务")} · ${esc(title)}</div><button type="button" class="text-button" data-detail-task="${esc(ev.issueId || '')}" data-detail-issue="${esc(ev.issue || '')}">查看任务详情</button><div class="comm-meta"><time datetime="${esc(ev.ts)}">${dayLabel(ev.ts)} ${hhmm(ev.ts)}</time><span>${esc(evidence)}</span></div><div class="receipt-panel">${receipt.detail}</div><div class="txt ${ev.sender?.kind === "user" || ev.user ? "" : "md"}">${ev.sender?.kind === "user" || ev.user ? esc(ev.text) : md(ev.text)}</div></article>`;
  $("#detailcontent").dataset.event = activeMessage;
  $("#detailpane").scrollTop = scroll;
  detailSignature = signature;
}
function syncActiveMessage(){
  $("#stream").querySelectorAll(".comm").forEach(el=>{
    const active = el.dataset.event === activeMessage;
    el.classList.toggle("active",active);
    el.querySelector("button").setAttribute("aria-expanded",String(active));
  });
  $('#stream').querySelectorAll('.execution-row').forEach(el=>{
    const active=panelOpen && detailTarget?.runId===el.dataset.run;
    el.classList.toggle('active',active);
    el.querySelector('button').setAttribute('aria-expanded',String(active));
  });
}
function closeDetail(restoreFocus = true){
  closePanel(restoreFocus);
}
function openTaskDetail(taskId,runId,issue,trigger){
  activeMessage=null;detailTarget={taskId,runId,issue};
  traceSelected={task:taskId,run:runId};detailSignature=null;
  if(trigger) detailReturnFocus=trigger;
  preserveStreamLayout(()=>openPanel());syncActiveMessage();
  $('#detailpane').focus({preventScroll:true});
}
function latestTaskRunId(task,issue){
  const candidates=[...(task?.attempts || []),...executionRuns.filter(r=>issue && r.issue===issue)];
  return candidates.filter(r=>r.agentId===selected).sort((a,b)=>(b.startedAt || b.ts || b.createdAt || '').localeCompare(a.startedAt || a.ts || a.createdAt || ''))[0]?.id;
}
$('#detailpane').addEventListener('click',e=>{
  const task=e.target.closest('[data-detail-task]');
  if(task){openTaskDetail(task.dataset.detailTask,null,task.dataset.detailIssue);return;}
  const retry=e.target.closest('[data-run-retry]');
  if(retry){loadDetailRun(retry.dataset.runRetry,true);detailSignature=null;renderDetail();}
});
document.addEventListener("keydown",e=>{
  if(e.key !== "Escape") return;
  if(!$("#taskmodal").hidden){e.preventDefault();closeTaskModal();return;}
  if(panelOpen){e.preventDefault();closePanel();}
});
$("#stream").addEventListener("click",e=>{
  const task=e.target.closest('[data-issue-detail]');
  if(task){openTaskDetail(task.dataset.issueDetail,null,task.dataset.issueKey,task);return;}
  const runButton=e.target.closest('[data-execution-detail]');
  if(runButton){
    const run=executionRuns.find(r=>r.id===runButton.dataset.executionDetail);
    if(run){if(panelOpen && detailTarget?.runId===run.id) closePanel();else openTaskDetail(null,run.id,run.issue,runButton);}
    return;
  }
  const button = e.target.closest(".comm-summary");
  if(!button) return;
  const key = button.closest(".comm").dataset.event;
  if(activeMessage === key){closeDetail();return;}
  preserveStreamLayout(()=>{
    activeMessage = key;
    detailTarget=null;traceSelected=null;detailReturnFocus=button;
    openPanel();
    renderDetail();
  });
  syncActiveMessage();
  $("#detailpane").focus({preventScroll:true});
});
$('#stream').addEventListener('keydown',e=>{
  const task=e.target.closest('[data-issue-detail]');
  if(task && ['Enter',' '].includes(e.key)){e.preventDefault();task.click();}
});

const RUN_STATUS = {queued:"排队中",running:"已开始",succeeded:"运行成功",failed:"运行失败",timed_out:"运行超时",cancelled:"已取消",cancelling:"取消中"};
function receiptView(ev){
  const receipt = ev.receipt, runs = receipt?.runs || [];
  const unavailable = !receipt || receipt.state === "unavailable";
  const scope = receipt?.scope;
  const note = `仅查询最近 ${scope?.runLimit || 200} 条运行${scope ? `（本次 ${scope.runsFetched} 条）` : ""}，非完整历史；运行状态不等于逐条已读或业务验收。`;
  if(!runs.length){
    const label = unavailable ? "回执暂不可用" : "暂无接收记录";
    return {label, tone:"", detail:`<strong>${label}</strong><div class="receipt-note">${unavailable ? "运行记录获取失败或尚未提供，可等待自动刷新。" : "当前查询窗口没有精确关联这条评论的运行，不能据此判断无人接收。"}</div><div class="receipt-note">${esc(note)}</div>`};
  }
  const latest = runs.filter((r,i) => runs.findIndex(x => x.agentId === r.agentId) === i);
  const main = latest[0], status = RUN_STATUS[main.status] || "状态未知";
  const label = `${main.agentName} ${status}${latest.length > 1 ? ` +${latest.length-1} 人` : ""}`;
  const tone = ["failed","timed_out"].includes(main.status) ? "failure" : ["running","queued"].includes(main.status) ? "active" : main.status==="succeeded" ? "success" : "";
  const time = iso => iso ? `${dayLabel(iso)} ${hhmm(iso)}` : "—";
  const rows = runs.map(r=>`<div class="receipt-row"><strong>${esc(r.agentName)} · ${esc(RUN_STATUS[r.status] || r.status)}</strong><small>开始：${esc(time(r.startedAt))} · 结束：${esc(time(r.finishedAt))}</small><small>运行：${esc(r.runId)} · 触发：${esc(r.wakeReason || "未提供")}</small></div>`).join("");
  return {label,tone,detail:`<strong>关联执行回执</strong>${rows}<div class="receipt-note">依据：评论 ID 与任务 ID 精确匹配运行唤醒上下文。</div><div class="receipt-note">${esc(note)}</div>`};
}

function renderEvents(events){
  const box = $("#stream");
  const signature = JSON.stringify([events, names, $('#tasks-search').value, $('#tasks-filter').value, tasks]);
  if(signature === roomSignature) return;
  // 没有变化就不重绘；有新记录时也保留正在读的通信条和展开状态。
  const first = roomSignature === null;
  const stuck = first || box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  const boxTop = box.getBoundingClientRect().top;
  const anchor = Array.from(box.querySelectorAll("[data-event]")).find(el => el.getBoundingClientRect().bottom > boxTop);
  const anchorKey = anchor?.dataset.event, anchorOffset = anchor ? anchor.getBoundingClientRect().top - boxTop : 0;
  const oldTop = box.scrollTop;
  roomSignature = signature;
  messageEvents = new Map(events.filter(ev=>ev.kind === "comment").map(ev=>[eventKey(ev),ev]));
  if(activeMessage && !messageEvents.has(activeMessage)) closeDetail(false);
  const query=$('#tasks-search').value.trim().toLocaleLowerCase(), filter=$('#tasks-filter').value;
  events=events.filter(ev=>{
    const task=tasks.find(t=>t.id===ev.issueId || t.identifier===ev.issue);
    const status=ev.kind==='issue' ? ev.status : task?.status;
    const active=ev.kind==='execution' ? ['running','queued','cancelling'].includes(ev.status) : (task?.attempts || []).some(r=>r.agentId===selected && ['running','queued','cancelling'].includes(r.status));
    return (!query || `${ev.issue || ''} ${ev.issueTitle || ev.title || ''}`.toLocaleLowerCase().includes(query)) &&
      (filter==='all' || filter==='active' && active || filter==='blocked' && status==='blocked' || filter==='open' && status && !['done','cancelled'].includes(status) || filter==='done' && ['done','cancelled'].includes(status));
  });
  if(!events.length){
    box.innerHTML = `<div class="stream-inner"><div class="empty"><div class="big">↗</div><strong>${query || filter!=='all' ? '没有匹配的任务记录' : '暂无任务记录'}</strong><span>${query || filter!=='all' ? '试试其他关键词或状态。' : '该成员最近没有任务消息。<br>需要沟通请切换到「对话」。'}</span></div></div>`;
    updateLatest();
    return;
  }

  let html = `<div class="timeline-note">消息与任务默认收起 · 点击在右侧查看详情</div>${executionLoaded?'<div class="execution-note">最近 4 次运行 · 工具调用与助手消息在右侧展示</div>':''}`, lastDay = "";
  for(const ev of events){
    const key = eventKey(ev);
    const day = dayKey(ev.ts);
    if(day && day !== lastDay){
      html += `<div class="daysep"><span>${dayLabel(ev.ts)}</span></div>`;
      lastDay = day;
    }
    if(ev.kind === 'execution'){
      html += executionHTML(ev);
      continue;
    }
    if(ev.kind === "issue"){
      const st = ev.status || "";
      const otherIssue = ev.mine === false;
      html += `<div class="issue-sep ${otherIssue?"other":""}" data-event="${key}" title="${esc(ev.title)}" role="button" tabindex="0" data-issue-detail="${esc(ev.issueId || '')}" data-issue-key="${esc(ev.issue || '')}" aria-controls="sidepanel">
        ${eventIcon('task')}
        <span class="bar ${esc(st)}"></span>
        <span class="id">${esc(ev.issue)}</span>
        <span class="ttl">${esc(ev.title)}</span>
        ${statusChip(st)}
      </div>`;
      continue;
    }

    const {from, to, title, evidence} = communication(ev);
    const receipt = receiptView(ev);
    const route = `${from} → ${to}`, topic = `${ev.issue || "任务"} · ${title}`;
    const direction = ["in", "out"].includes(ev.dir) ? ev.dir : "related";
    html += `<div class="comm ${direction} ${activeMessage===key ? "active" : ""}" data-event="${key}">
      <button type="button" class="comm-summary" aria-controls="sidepanel" aria-expanded="${activeMessage===key}" aria-label="${esc(route + "：" + topic)}" title="${esc(route + " · " + topic)}">
        ${eventIcon('message')}<span class="comm-route">${avatarRoute(ev)}</span>
        <span class="comm-divider" aria-hidden="true">·</span><span class="comm-title">${esc(topic)}</span>
        <span class="receipt-badge ${receipt.tone}" title="${esc(receipt.label)}">${esc(receipt.label)}</span>
        <svg class="comm-chevron" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 4 4 4-4 4"/></svg>
      </button>
    </div>`;
  }
  box.innerHTML = `<div class="stream-inner">${html}</div>`;
  syncActiveMessage();
  if(panelOpen) renderDetail();
  if(stuck) box.scrollTop = box.scrollHeight;
  else {
    const nextAnchor = Array.from(box.querySelectorAll("[data-event]")).find(el => el.dataset.event === anchorKey);
    box.scrollTop = nextAnchor ? box.scrollTop + nextAnchor.getBoundingClientRect().top - boxTop - anchorOffset : oldTop;
  }
  updateLatest();
}

/* ---------- 输入 ---------- */
const input = $("#input");
function updateComposer(){
  const pending = sending.has(selected);
  const ready = !!selected && chatEnabled && !pending;
  input.disabled = !ready;
  $("#send").disabled = !ready || !input.value.trim();
  $("#newtask").disabled = !selected;
  $("#send").setAttribute("aria-label", pending ? "正在发送" : `发送给 ${names[selected] || "成员"}`);
  $("#send .send-label").textContent = pending ? "发送中" : "发送";
  $("#draftlabel").textContent = pending ? "正在发送…" : input.value ? "草稿 · 切换成员会保留" : "";
  input.style.height = "auto";
  input.style.height = $("#chatpane").hidden ? "" : Math.min(input.scrollHeight, 130) + "px";
  $("#counter").textContent = input.value.length;
}
input.addEventListener("input", () => {
  if(selected) drafts.set(selected, input.value);
  updateComposer();
});
let composing = false, compositionEnd = 0;
input.addEventListener("compositionstart", () => composing = true);
input.addEventListener("compositionend", () => { composing = false; compositionEnd = performance.now(); });
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing && !composing && e.keyCode !== 229 && performance.now() - compositionEnd > 80){ e.preventDefault(); doSend(); }
});

async function doSend(){
  const text = input.value.trim();
  if(!text || !selected || sending.has(selected) || !chatEnabled) return;
  const id = selected, name = names[id];
  drafts.set(id, input.value);
  sending.add(id); updateComposer();
  try{
    const d = await requestJSON("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({agentId:id, text})
    });
    if(d.ok){
      drafts.delete(id);
      if(selected === id){
        input.value = "";
        chatReplying = true;
        renderChat();
        loadChat(true);
      }
      toast(`已发送给 ${name}`);
      refreshState();
    } else {
      toast("发送失败：" + (d.error || "未知"));
      loadChat(true);
    }
  }catch(e){ toast("未确认发送结果，草稿已保留；请核对消息后再试"); }
  finally{ sending.delete(id); updateComposer(); }
}
$("#send").onclick = doSend;

function startTimers(){
  setInterval(() => { if(!document.hidden) refreshState(); }, 5000);
  setInterval(() => { if(!document.hidden) loadRoom(); }, 8000);
  setInterval(() => { if(!document.hidden) loadExecution(); }, 8000);
  setInterval(() => { if(!document.hidden && (view === 'tasks' || panelOpen)) loadTasks(); }, 8000);
  setInterval(() => { if(!document.hidden && view === "chat" && chatState !== "disabled" && chatState !== "empty") loadChat(); }, 4000);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden){
      refreshState();
      loadRoom();
      loadExecution();
      if(view === "chat") loadChat();
      if(view === 'tasks' || panelOpen) loadTasks();
    }
  });
}
async function boot(){
  await loadTeams();
  refreshState();
  startTimers();
}
boot();
